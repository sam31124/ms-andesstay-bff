server:
  port: 8080

spring:
  application:
    name: ms-andesstay-bff
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:andesstaydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://sts.windows.net/64ab2952-0d1a-49ef-a64b-0494bc1432e8/
          audiences: api://32043bc9-7878-4474-b8d2-61cb242aab22
          jwk-set-uri: https://login.microsoftonline.com/64ab2952-0d1a-49ef-a64b-0494bc1432e8/discovery/v2.0/keys

services:
  reservations:
    url: ${SERVICES_RESERVATIONS_URL:http://localhost:8081}
  catalog:
    url: ${SERVICES_CATALOG_URL:http://localhost:8082}
  rabbitadmin:
    url: ${SERVICES_RABBITADMIN_URL:http://localhost:8084}
  notify:
    url: ${SERVICES_NOTIFY_URL:http://localhost:8083}

logging:
  level:
    org.springframework.security: DEBUG